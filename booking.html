<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Tickets | VibeZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="booking-page">
  <header class="site-header">
    <div class="shell header-row">
      <a class="logo" href="index.html">
        <span class="logo-badge">VZ</span>
        <span class="logo-text">Vibe<span>Zone</span></span>
      </a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="events.html">Explore Events</a>
        <a href="dashboard.html">Artist Dashboard</a>
        <a href="bookings.html">My Bookings</a>
      </nav>
      <div class="header-actions">
        <a class="login-link" href="login.html">Log in</a>
        <a class="signup-button" href="signup.html">Sign up</a>
      </div>
    </div>
  </header>

  <main class="booking-main">
    <div class="shell booking-shell">
      <div class="booking-layout">
        <form class="booking-card-form" id="booking-form">
          <div class="booking-header">
            <p class="booking-label">Ticket booking</p>
            <h1 id="booking-event-title">Book your event</h1>
            <p id="booking-event-subtitle">Select tickets and confirm your booking.</p>
          </div>

          <label>
            <span>Ticket type</span>
            <select id="booking-ticket-type">
              <option value="General Admission">General Admission - Standard access</option>
              <option value="Premium">Premium - Better seating</option>
              <option value="VIP">VIP - Front row perks</option>
            </select>
          </label>

          <label>
            <span>Quantity</span>
            <input id="booking-quantity" type="number" min="1" max="8" value="1">
          </label>

          <label>
            <span>Full name</span>
            <input id="booking-name" type="text" placeholder="Your name" required>
          </label>

          <label>
            <span>Email</span>
            <input id="booking-email" type="email" placeholder="you@example.com" required>
          </label>

          <button class="auth-submit" id="booking-submit" type="submit">Confirm Booking</button>
        </form>

        <aside class="booking-summary-card">
          <h2>Booking Summary</h2>
          <div class="booking-summary-list">
            <div><span>Event</span><strong id="summary-event">-</strong></div>
            <div><span>Date</span><strong id="summary-date">-</strong></div>
            <div><span>Time</span><strong id="summary-time">-</strong></div>
            <div><span>City</span><strong id="summary-city">-</strong></div>
            <div><span>Price</span><strong id="summary-price">₹0</strong></div>
            <div><span>Total</span><strong id="summary-total">₹0</strong></div>
          </div>
          <p class="booking-summary-note">This prototype stores bookings locally in your browser.</p>
        </aside>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
