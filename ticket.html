<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket | VibeZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="booking-page">
  <header class="site-header">
    <div class="shell header-row">
      <a class="logo" href="index.html">
        <span class="logo-badge">VZ</span>
        <span class="logo-text">Vibe<span>Zone</span></span>
      </a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="events.html">Explore Events</a>
        <a href="dashboard.html">Artist Dashboard</a>
        <a href="bookings.html">My Bookings</a>
      </nav>
      <div class="header-actions">
        <a class="login-link" href="login.html">Log in</a>
        <a class="signup-button" href="signup.html">Sign up</a>
      </div>
    </div>
  </header>

  <main class="booking-main">
    <div class="shell booking-shell">
      <section class="ticket-card" id="ticket-card">
        <div class="ticket-pass">
          <div class="ticket-pass-main">
            <p class="booking-label">Confirmed Ticket</p>
            <h1 id="ticket-title">Event Ticket</h1>
            <p class="ticket-subline">Entry pass generated by VibeZone</p>
            <div class="ticket-grid">
              <div><span>Name</span><strong id="ticket-name">-</strong></div>
              <div><span>Date</span><strong id="ticket-date">-</strong></div>
              <div><span>Time</span><strong id="ticket-time">-</strong></div>
              <div><span>City</span><strong id="ticket-city">-</strong></div>
              <div><span>Ticket Type</span><strong id="ticket-type">-</strong></div>
              <div><span>Quantity</span><strong id="ticket-quantity">-</strong></div>
              <div><span>Total Paid</span><strong id="ticket-total">₹0</strong></div>
              <div><span>Status</span><strong id="ticket-status">Confirmed</strong></div>
            </div>
          </div>
          <div class="ticket-pass-side">
            <div class="ticket-qr" id="ticket-qr">
              <span class="ticket-qr-center">VZ</span>
            </div>
            <p class="ticket-code-label">Booking Code</p>
            <strong class="ticket-code" id="ticket-code">VZ-0000</strong>
          </div>
        </div>
        <div class="detail-actions-block">
          <button class="auth-submit detail-book-button" id="ticket-print-button" type="button">Download / Print</button>
          <a class="cancel-button" href="bookings.html">Back to My Bookings</a>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
